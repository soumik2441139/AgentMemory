services:
  redis:
    image: redis:7-alpine
    container_name: agentmemory-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  agentmemory-api:
    build: .
    container_name: agentmemory-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AGENTMEMORY_DB_PATH=/app/data/agentmemory.db
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - AGENTMEMORY_API_KEY=${AGENTMEMORY_API_KEY:-}
      - AGENTMEMORY_AUTO_SUMMARIZE=${AGENTMEMORY_AUTO_SUMMARIZE:-false}
    depends_on:
      - redis
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

volumes:
  redis_data:
  sqlite_data:
